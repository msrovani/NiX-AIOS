name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: system deps (slint)
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev libxkbcommon-dev \
            libwayland-dev libgl1-mesa-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev
      - name: fmt
        working-directory: packages/nosd
        run: cargo fmt --all --check
      - name: clippy
        working-directory: packages/nosd
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: system deps (linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev libxkbcommon-dev \
            libwayland-dev libgl1-mesa-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev
      - name: test
        working-directory: packages/nosd
        run: cargo test --workspace

  nix-vm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: nosd package
        run: nix build .#nosd --print-out-paths
      - name: nixos VM smoke (health + chat + voz + S-09)
        # Runners sem /dev/kvm nao anunciam a feature; o teste corre na mesma
        # em TCG. Sem isto o build falha com "missing system features {kvm}".
        run: >
          nix build .#checks.x86_64-linux.nixaios-vm -L
          --option system-features "kvm nixos-test big-parallel benchmark"

  # Frota: 2 VMs por check (mesh, identidade, jobs, CRDT, skills).
  # Um job por check para isolar falhas e paralelizar.
  fleet:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        check: [mesh-2vm, mesh-2vm-signed, mesh-2vm-jobs, mesh-2vm-crdt, mesh-2vm-skills]
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: ${{ matrix.check }}
        run: >
          nix build .#checks.x86_64-linux.${{ matrix.check }} -L
          --option system-features "kvm nixos-test big-parallel benchmark"

  # ISO is heavy (~2.7G); run on demand, not every PR.
  iso:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: build ISO
        run: nix build .#iso -L --print-out-paths
      - uses: actions/upload-artifact@v4
        with:
          name: nixaios-iso
          path: result/iso/*.iso
