[package]
name = "nosd"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "nosd_lib"
path = "src/lib.rs"

[[bin]]
name = "nosd"
path = "src/main.rs"

[[bin]]
name = "nosctl"
path = "src/nosctl.rs"

[[bin]]
name = "nosmcp"
path = "src/nosmcp.rs"

[dependencies]
nos-core = { path = "../nos-core" }
nos-ipc = { path = "../nos-ipc" }
nos-bus = { path = "../nos-bus" }
nos-cortex = { path = "../nos-cortex" }
nos-factory = { path = "../nos-factory", features = ["net"] }
nos-bei = { path = "../nos-bei" }
nos-hermes = { path = "../nos-hermes" }
nos-memory = { path = "../nos-memory" }
nos-mesh = { path = "../nos-mesh" }
nos-voice = { path = "../nos-voice" }
nos-wasm = { path = "../nos-wasm" }
nos-observe = { path = "../nos-observe" }
nos-mcp = { path = "../nos-mcp" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
base64 = { workspace = true }
wat = { workspace = true }
parking_lot = { workspace = true }
libc = "0.2"

[dev-dependencies]
tempfile = { workspace = true }
libc = "0.2"
